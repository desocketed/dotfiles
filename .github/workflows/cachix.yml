name: cachix

on:
  push:
    branches: [nixnixnix]
  workflow_dispatch:

concurrency:
  group: cachix-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: cachix/cachix-action@v16
        with:
          name: ${{ vars.CACHIX_CACHE }}
          # Without the secret the cache is only read, never pushed to.
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # Personal values live in the gitignored hosts/local.nix; build with the example's placeholders.
      # Flakes only see files git knows about, hence the intent-to-add.
      - run: cp hosts/local.nix.example hosts/local.nix && git add -f -N hosts/local.nix
      # One build for every profile: shared packages are fetched or built once
      - run: |
          nix build --no-link --keep-going \
            .#homeConfigurations.framework.activationPackage \
            .#homeConfigurations.work.activationPackage \
            .#homeConfigurations.desktop.activationPackage
