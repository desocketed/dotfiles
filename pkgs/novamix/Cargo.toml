[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Unlicense"

[workspace]
resolver = "3"
members = [
	"crates/novamix",
	"crates/novamix-daemon",
	"crates/novamix-cli",
]

[workspace.dependencies]
novamix = { path = "crates/novamix" }

anyhow = "1"
clap = { version = "4.6.7", features = ["derive", "env"] }
crossbeam-channel = "0.5.17"
dirs = "6.0.0"
env_logger = "0.11.11"
log = "0.4.35"

# CONFIG
regex = "1" # a stream's match against the rules, for `route list`
toml = "1.2.1" # https://github.com/toml-rs/toml

# DEVICE
hidapi = { version = "2.6.7", default-features = false, features = ["linux-native"] } # https://github.com/ruabmbua/hidapi-rs

# IPC
bincode = "2.0.1" # https://github.com/bincode-org/bincode

# SINKS
pipewire = "0.10.1" # https://gitlab.freedesktop.org/pipewire/pipewire-rs
