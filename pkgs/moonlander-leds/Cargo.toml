[package]
name = "moonlander-leds"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.8", features = ["derive"] }
crossbeam-channel = "0.5.17"
dirs = "7.0.0"
env_logger = "0.11.11"
gpui = { version = "=0.2.2", default-features = false, features = ["wayland", "font-kit"] }
hidapi = "2.6.7"
log = "0.4.35"
mpris = "2.1.0"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
